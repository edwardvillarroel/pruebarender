services:
  db:
    image: postgres:16
    container_name: print3d_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: print3d_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d print3d_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: