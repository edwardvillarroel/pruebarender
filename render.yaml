services:
  - type: web
    name: apolovibes
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/iniciar_render.sh
    healthCheckPath: /health
    envVars:
      - { key: PYTHON_VERSION, value: "3.13.5" }
      - { key: DB_BACKEND, value: postgres }
      - { key: GATEWAY_SECRET_KEY, generateValue: true }
      - { key: SECRET_KEY, generateValue: true }
      - { key: GATEWAY_COOKIE_SECURE, value: "true" }
      - { key: BACKEND_INTERNAL_URL, value: "http://127.0.0.1:8000" }
      # OWASP A01: firma la frontera gateway -> backend. La misma variable la
      # leen ambos procesos (mismo servicio). Sin ella el backend es fail-closed.
      - { key: INTERNAL_SECRET, generateValue: true }
      - { key: FRONTEND_URL, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: GOOGLE_REDIRECT_URI, sync: false }
      - { key: RECAPTCHA_SITE_KEY, sync: false }
      - { key: RECAPTCHA_SECRET_KEY, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: TUU_URL_CALLBACK, sync: false }
      - { key: TUU_URL_COMPLETE, sync: false }
      - { key: TUU_URL_CANCEL, sync: false }
      - { key: STARKEN_API_KEY, sync: false }
      - { key: LLM_API_KEY, sync: false }
      - { key: COTIZADOR_IA_URL, sync: false }
      - { key: CRON_SECRET, sync: false }
      # Supabase Storage de cotizaciones (F4). Sin ellas el backend sigue
      # guardando las imagenes en disco local.
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_KEY, sync: false }
      - { key: SUPABASE_STORAGE_BUCKET, sync: false }
      - { key: SUPABASE_SIGN_TTL_SECONDS, sync: false }
